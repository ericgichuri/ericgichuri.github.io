    <script>
        $(function(){

    <section class="pt-10 pb-12 bg-[var(--bg-color)]">

            </p>
        </div>
    </section>

    <section class="pb-24">
        <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-12 gap-12">
            
            <div class="md:col-span-5 space-y-8">
                <div class="p-8 bg-[var(--card-color)] border border-[var(--border-color)] rounded-2xl shadow-sm">
                    <h3 class="text-xl font-bold mb-6 text-[var(--text-color)]">Contact Details</h3>
                    
                    <div class="space-y-6">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-[var(--primary-color)]/10 flex items-center justify-center text-[var(--primary-color)]">

                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-[var(--text-light)]">Call Me</p>
                                <a href="tel:+254768174127" class="text-[var(--text-color)] font-medium hover:text-[var(--primary-color)] transition-colors">+254 768 174 127</a>
                            </div>
                        </div>

                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-[var(--primary-color)]/10 flex items-center justify-center text-[var(--primary-color)]">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-[var(--text-light)]">Email Me</p>
                                <a href="mailto:ericgichuri2605@gmail.com" class="text-[var(--text-color)] font-medium hover:text-[var(--primary-color)] transition-colors">ericgichuri2605@gmail.com</a>

                        </div>

                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-[var(--primary-color)]/10 flex items-center justify-center text-[var(--primary-color)]">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-[var(--text-light)]">Location</p>
                                <p class="text-[var(--text-color)] font-medium">Nairobi, Kenya</p>

                        <div class="flex gap-4">

                            <a href="https://linkedin.com/in/eric-gichuri" target="_blank" class="w-10 h-10 rounded-lg bg-[var(--bg-color)] border border-[var(--border-color)] flex items-center justify-center hover:text-[#0077B5] transition-all"><i class="fa-brands fa-linkedin-in"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-1 md:col-span-7">
                <form id="contactForm" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold mb-2 text-[var(--text-color)]">Your Name</label>
                            <input type="text" placeholder="enter name" class="w-full px-4 py-3 rounded-xl bg-[var(--card-color)] border border-[var(--border-color)] focus:border-[var(--primary-color)] outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 text-[var(--text-color)]">Email Address</label>
                            <input type="email" placeholder="enter email" class="w-full px-4 py-3 rounded-xl bg-[var(--card-color)] border border-[var(--border-color)] focus:border-[var(--primary-color)] outline-none transition-all">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold mb-2 text-[var(--text-color)]">Subject</label>
                        <select class="w-full px-4 py-3 rounded-xl bg-[var(--card-color)] border border-[var(--border-color)] focus:border-[var(--primary-color)] outline-none transition-all">
                            <option>General Inquiry</option>
                            <option>Project Proposal</option>
                            <option>Job Opportunity</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold mb-2 text-[var(--text-color)]">Message</label>
                        <textarea rows="5" placeholder="How can I help you?" class="w-full px-4 py-3 rounded-xl bg-[var(--card-color)] border border-[var(--border-color)] focus:border-[var(--primary-color)] outline-none transition-all resize-none"></textarea>
                    </div>

                    <button type="submit" class="w-full md:w-auto bg-[var(--primary-color)] text-white px-10 py-4 rounded-xl font-bold hover:translate-y-[-2px] hover:shadow-lg hover:bg-[var(--accent-color)] transition-all">
                        Send Message <i class="fa-solid fa-paper-plane ml-2 text-sm"></i>
                    </button>
                </form>
            </div>

        </div>
    </section>
    <section id="cta-section"></section>
    <div id="footer"></div>
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function () {
            $("#contactForm").on("submit",function(e){

                alert("Error Submit the form. Use Email or Phone Call")
